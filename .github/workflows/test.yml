name: test
on:
  push
jobs:
  automated-scrape:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@main

      - name: run commands
        run: |
          #node ./m3u-checker.js test_input/ test_output/ --quiet
          for i in $(cat stations.txt) ; do curl -s https://nradiobox.com/station/$i > mep1 ; u=$(perl -0777 -MJSON::PP -ne 'if (/\burl_resolved:\s*("(?:\\.|[^"\\])*")/) { print decode_json($1) }' mep1) ; t=$(perl -0777 -MJSON::PP -ne 'if (/\bname:\s*("(?:\\.|[^"\\])*")/) { print decode_json($1) }' mep1) ; g=$(perl -0777 -MJSON::PP -ne 'if (/\btags:\s*("(?:\\.|[^"\\])*")/) { print decode_json($1) }' mep1) ; c=$(perl -0777 -MJSON::PP -ne 'if (/\bcountry:\s*("(?:\\.|[^"\\])*")/) { print decode_json($1) }' mep1) ; [ -z "$u" ] && continue ; c=$(printf '%s' "$c" | sed 's/[[:space:]]\+/_/g ; s/[^[:alnum:]_-]/_/g') ; f="$c.m3u" ; [ -f "$f" ] || echo "#EXTM3U" > "$f" ; printf '#EXTINF:-1,%s\n%s\n' "$t" "$u" >> "$f" ; for tag in $(printf '%s' "$g" | sed 's/,/ /g ; s/[[:space:]]\+/_/g ; s/[^[:alnum:]_-]/_/g') ; do f="$tag.m3u" ; [ -f "$f" ] || echo "#EXTM3U" > "$f" ; printf '#EXTINF:-1,%s\n%s\n' "$t" "$u" >> "$f" ; echo $i ; done ; done
          rm mep1

      - name: git stuff
        run: |
          git config --local user.email "action[bot]@github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "$(od -An -tx4 -w16 -N16 /dev/urandom | cut -c2- | tr '[:lower:]' '[:upper:]')"
          git push
