name: test
on:
  push
jobs:
  automated-scrape:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@main

      - name: run commands
        run: |
          #node ./m3u-checker.js test_input/ test_output/ --quiet
          while IFS= read -r i; do curl -s "https://nradiobox.com/station/$i" > mep1; u=$(perl -0777 -MJSON::PP -ne 'if (/\burl_resolved:\s*("(?:\\.|[^"\\])*")/) { print decode_json($1) }' mep1); t=$(perl -0777 -MJSON::PP -ne 'if (/\bname:\s*("(?:\\.|[^"\\])*")/) { print decode_json($1) }' mep1); g=$(perl -0777 -MJSON::PP -ne 'if (/\btags:\s*("(?:\\.|[^"\\])*")/) { print decode_json($1) }' mep1); c=$(perl -0777 -MJSON::PP -ne 'if (/\bcountry:\s*("(?:\\.|[^"\\])*")/) { print decode_json($1) }' mep1); [ -z "$u" ] && continue; c=$(printf '%s' "$c" | LC_ALL=C sed 's/[[:space:]]\+/_/g; s/[^A-Za-z0-9_-]/_/g' | cut -c1-100); f="$c.m3u"; [ -f "$f" ] || printf '#EXTM3U\n' > "$f"; printf '#EXTINF:-1,%s\n%s\n' "$t" "$u" >> "$f"; while IFS= read -r tag; do tag=$(printf '%s' "$tag" | LC_ALL=C sed 's/[[:space:]]\+/_/g; s/[^A-Za-z0-9_-]/_/g' | cut -c1-100); [ -z "$tag" ] && continue; f="$tag.m3u"; [ -f "$f" ] || printf '#EXTM3U\n' > "$f"; printf '#EXTINF:-1,%s\n%s\n' "$t" "$u" >> "$f"; done < <(printf '%s\n' "$g" | tr ',' '\n'); echo "$i"; done < stations.txt
          rm mep1

      - name: git stuff
        run: |
          git config --local user.email "action[bot]@github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "$(od -An -tx4 -w16 -N16 /dev/urandom | cut -c2- | tr '[:lower:]' '[:upper:]')"
          git push
