name: test
on:
  push
jobs:
  automated-scrape:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@main

      - name: run commands
        run: |
          #node ./m3u-checker.js test_input/ test_output/ --quiet
          for i in A-*.txt ; do printf '#EXTM3U\n' > A$i ; for j in $(cat $i) ; do curl --socks5 127.0.0.1:10908 -s https://nradiobox.com/station/$j > mep1 ; t=$(./htmlq -t h1 < mep1 | sed 's/^[[:space:]]*//') ; u=$(perl -0777 -MJSON::PP -ne 'if (/\burl_resolved:\s*("(?:\\.|[^"\\])*")/) { print JSON::PP::decode_json($1), "\n" }' mep1) ; [ -z "$u" ] && continue; printf '#EXTINF:-1,%s\n%s\n' "$t" "$u" >> A$i ; echo "$i - $j" ; done ; done
          rm mep1

      - name: git stuff
        run: |
          git config --local user.email "action[bot]@github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "$(od -An -tx4 -w16 -N16 /dev/urandom | cut -c2- | tr '[:lower:]' '[:upper:]')"
          git push
