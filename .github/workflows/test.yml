name: test
on:
  push
jobs:
  automated-scrape:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@main

      - name: run commands
        run: |
          #node ./m3u-checker.js test_input/ test_output/ --quiet
          for i in \?page=10 ; do while IFS= read -r j ; do curl -s "https://nradiobox.com/country/$j$i" > mep1 ; name=$(./htmlq -t h1 < mep1) ; safe_name=$(printf '%s' "$name" | sed 's/[^[:alnum:]_.-]/_/g'); [ -n "$safe_name" ] || safe_name=$j ; ./htmlq -a href a < mep1 | grep station | grep '/station/' | cut -c10- >> A-$safe_name.txt ; echo "$j - $i" ; done < countries.txt ; done
          for i in \?page=10 ; do for j in $(cat genres.txt) ; do curl -s https://nradiobox.com/genre/$i$j | ./htmlq -a href a | grep station | grep '/station/' | cut -c10- >> A-$j.txt ; echo -e "$j - $i" ; done ; done
          rm mep1

      - name: git stuff
        run: |
          git config --local user.email "action[bot]@github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "$(od -An -tx4 -w16 -N16 /dev/urandom | cut -c2- | tr '[:lower:]' '[:upper:]')"
          git push
